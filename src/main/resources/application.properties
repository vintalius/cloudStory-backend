spring.application.name=cloudstory-backend

# MySQL Connection
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:72.62.175.50}:${MYSQL_PORT:3306}/${MYSQL_DB:cosmic}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:StrongPassword123}

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Game Server Configuration
game.expRate=1x
game.dropRate=1x
game.mesoRate=1x

# JPA Settings
# 'update' keeps your existing MapleStory tables safe while allowing new tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Force Hibernate to use exact column names (nxCredit instead of nx_credit)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger Settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger Admin User
spring.security.user.name=adminTal
spring.security.user.password=Tal!123

